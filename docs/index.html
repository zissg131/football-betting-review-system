<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>足球投注复盘分析系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Football Betting Review System v0.1</p>
      <h1>足球投注复盘分析系统</h1>
      <p class="subhead">输入投注记录，自动计算 ROI、命中率、回撤、冲动下注比例和单笔决策质量分。</p>
    </div>
    <div class="hero-card">
      <strong>核心原则</strong>
      <span>先复盘纪律，再谈预测。</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>1. 输入单笔投注</h2>
      <form id="betForm" class="grid-form">
        <label>日期<input name="date" type="date" required /></label>
        <label>赛事<input name="league" placeholder="英超 / 欧冠 / 日职" required /></label>
        <label>比赛<input name="match" placeholder="阿森纳 vs 利物浦" required /></label>
        <label>玩法<input name="market" placeholder="胜平负 / 让球 / 大小球 / 半全场" required /></label>
        <label>选择<input name="pick" placeholder="主胜 / 大2.5 / 平负" required /></label>
        <label>赔率<input name="odds" type="number" step="0.01" min="1.01" required /></label>
        <label>下注金额<input name="stake" type="number" step="0.01" min="0" required /></label>
        <label>下注前本金<input name="bankroll_before" type="number" step="0.01" min="0" required /></label>
        <label>结果
          <select name="result" required>
            <option value="win">赢</option>
            <option value="loss">输</option>
            <option value="push">走水</option>
          </select>
        </label>
        <label>盈亏<input name="profit_loss" type="number" step="0.01" placeholder="赢填正数，输填负数" required /></label>
        <label>信息质量 0-5<input name="information_quality" type="number" min="0" max="5" step="1" value="3" required /></label>
        <label>盘口逻辑 0-5<input name="market_logic" type="number" min="0" max="5" step="1" value="3" required /></label>
        <label class="wide">赛前理由<textarea name="pre_match_reason" rows="3" placeholder="写清楚：伤停、赛程、战意、盘口变化、赔率位置、阵容预期等。"></textarea></label>
        <label class="wide">纪律标签<textarea name="discipline_flags" rows="2" placeholder="例如：正常 / 冲动 / 追回 / 临场上头 / 降仓"></textarea></label>
        <button type="submit">添加记录并分析</button>
      </form>
    </section>

    <section class="panel">
      <h2>2. 批量导入 / 导出</h2>
      <div class="actions">
        <input id="csvFile" type="file" accept=".csv,text/csv" />
        <button id="loadSample" type="button">加载示例数据</button>
        <button id="exportCsv" type="button">导出 CSV</button>
        <button id="clearAll" type="button" class="danger">清空本地数据</button>
      </div>
      <p class="hint">数据保存在你的浏览器 localStorage 里，不会自动上传到服务器。</p>
    </section>

    <section class="panel wide-panel">
      <h2>3. 总体分析</h2>
      <div id="summary" class="summary-grid"></div>
      <div class="diagnosis" id="diagnosis"></div>
      <canvas id="equityChart" height="220"></canvas>
    </section>

    <section class="panel wide-panel">
      <h2>4. 单笔复盘表</h2>
      <div class="table-wrap">
        <table id="betTable">
          <thead>
            <tr>
              <th>日期</th><th>比赛</th><th>玩法</th><th>选择</th><th>赔率</th><th>金额</th><th>盈亏</th><th>仓位</th><th>评分</th><th>等级</th><th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>残酷现实：这个工具不能让你稳赚。它只能暴露你有没有纪律、有没有证据链、有没有长期统计。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
